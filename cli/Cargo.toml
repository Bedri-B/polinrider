[package]
name = "polinrider"
version = "1.0.0"
edition = "2021"
description = "PolinRider / auth-con-firm / TaskJacker worm scanner & fixer for local git repos and project folders"
license = "MIT"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
