name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,  target: x86_64-unknown-linux-musl, bin: polinrider,     out: polinrider-linux-x64 }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc,    bin: polinrider.exe, out: polinrider-windows-x64.exe }
          - { name: macos-arm64, os: macos-latest,   target: aarch64-apple-darwin,      bin: polinrider,     out: polinrider-macos-arm64 }
          - { name: macos-x64,   os: macos-latest,   target: x86_64-apple-darwin,       bin: polinrider,     out: polinrider-macos-x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: musl linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: cli
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: mkdir -p out && cp "cli/target/${{ matrix.target }}/release/${{ matrix.bin }}" "out/${{ matrix.out }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}
          if-no-files-found: error
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "polinrider $TAG" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
